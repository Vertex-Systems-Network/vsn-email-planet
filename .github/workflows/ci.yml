name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vsn_test
          POSTGRES_USER: vsn
          POSTGRES_PASSWORD: vsn_local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsn -d vsn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://vsn:vsn_local_test_only@127.0.0.1:5432/vsn_test
          VSN_TEST_DATABASE: "1"
      - run: npm run check:backlog
      - run: npm run validate:state
      - run: npm run build
      - run: node scripts/smoke-web.mjs
      - run: node scripts/smoke-bootstrap-api.mjs
        env:
          DATABASE_URL: postgres://vsn:vsn_local_test_only@127.0.0.1:5432/vsn_test
          VSN_TEST_DATABASE: "1"
      - run: node scripts/smoke-api.mjs
        env:
          DATABASE_URL: postgres://vsn:vsn_local_test_only@127.0.0.1:5432/vsn_test
          VSN_TEST_DATABASE: "1"
      - run: npm audit --audit-level=high
